name: Crypto features

# The `crypto` / `nizk` features (and the `pyo3` binding that needs them) depend on the
# sibling ALICE-Crypto, which the other jobs replace with an empty stub. This job builds
# and tests them against the real crate at the revision .github/alice-crypto-pin names
# (scripts/crypto_features.sh, also run by scripts/preflight.sh). It fails when the
# requirement no longer resolves to that crate and when no `nizk::` or `crypto_bridge::`
# test ran.

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/crypto_features.sh'
      - '.github/alice-crypto-pin'
      - '.github/workflows/crypto-features.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/crypto_features.sh'
      - '.github/alice-crypto-pin'
      - '.github/workflows/crypto-features.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  crypto-features:
    name: Crypto features (real ALICE-Crypto at the pin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/crypto-features"
      - name: Build and test crypto / nizk, check pyo3
        run: scripts/crypto_features.sh
