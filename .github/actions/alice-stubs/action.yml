name: 'ALICE-Auth Optional Bridge Stubs'
description: |
  Create empty stub crates for ALICE-Auth's sibling path deps (alice-crypto)
  so that ALICE-Auth can resolve its workspace-relative path deps in CI.
  The stub's version must satisfy the requirement in Cargo.toml.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ALICE-Crypto stub (features needed: default = ["std"])
        # ALICE-Auth uses alice-crypto with default-features = false, features = ["std"]
        # so we need at least the "std" feature declared to satisfy resolution.
        mkdir -p "../ALICE-Crypto/src"
        cat > "../ALICE-Crypto/Cargo.toml" <<'TOML'
        [package]
        name = "alice-crypto"
        version = "0.4.1"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Crypto/src/lib.rs"

        echo "Created stub: alice-crypto (license = MIT OR Apache-2.0, features = std)"
