[package]
name = "alice-auth"
version = "0.6.0"
# slice::as_chunks (totp.rs) が 1.88 で stable、CI msrv job で実 compile
rust-version = "1.88"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Ed25519 ZKP auth for ALICE"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Auth"
homepage = "https://github.com/ext-sakamoro/ALICE-Auth"
documentation = "https://docs.rs/alice-auth"
keywords = ["auth", "ed25519", "zkp", "no_std"]
categories = ["cryptography", "no-std"]

[lib]
crate-type = ["lib"]
# FFI shared library: cargo rustc --features ffi --crate-type cdylib

[features]
default = ["std"]
std = ["alloc", "getrandom/std"]
alloc = []
serde = ["dep:serde"]
ffi = ["std", "api"]  # src/ffi.rs が api_bridge::AuthToken を無条件使用 (2026-09-15 まで api 欠落で ffi 単独は compile 不能)
pyo3 = ["dep:pyo3", "std", "api", "nizk"]  # Python bindings (no numpy needed): src/python.rs binds the api_bridge / crypto_bridge / nizk items, so the wheel (pyproject.toml `features = ["pyo3"]`) enables them
crypto = ["dep:alice-crypto", "std"]  # ALICE-Crypto token hashing + session encryption
nizk = ["dep:curve25519-dalek", "crypto", "std"]  # Schnorr NIZK proof (true ZKP)
db = ["std"]  # Auth audit log (self-contained BTreeMap store)
# bare-metal (getrandom 非対応 target) 用: 最終 binary 側で getrandom::register_custom_getrandom! を登録
custom-rng = ["getrandom/custom"]
api = ["std"]  # ALICE-API auth middleware bridge

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["hazmat", "zeroize"] }
getrandom = { version = "0.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
alice-crypto = { git = "https://github.com/ext-sakamoro/ALICE-Crypto", rev = "eefb7bab69b82f334bf5c86138bed1e19125a570", version = "0.6", optional = true, default-features = false, features = ["std"] }
curve25519-dalek = { version = "4", default-features = false, optional = true, features = ["zeroize", "alloc"] }

[profile.release]
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process ごと落ちる
opt-level = 3
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
